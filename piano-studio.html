<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piano Studio</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2430;--mut:#6b7380;--line:#ddd7c9;--acc:#1f6feb;--ok:#1f9d55;--bad:#d64545;--tip:#f6f4ee}
html.dark{--bg:#12171d;--card:#1c232b;--ink:#e8edf2;--mut:#9aa6b2;--line:#323c47;--acc:#4c8dff;--ok:#2fb86a;--bad:#e05a5a;--tip:#252e38;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 16px}
h1{font-size:20px;margin:0}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
#levels{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px}
#levels button{white-space:nowrap;font-size:13px;padding:6px 10px}
#levels button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#levels small{opacity:.65;margin-left:4px}
main{max-width:1500px;margin:auto;padding:0 12px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:8px}
#info{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mut)}
#info b{color:var(--ink)}
#title{font-weight:700;font-size:17px;margin:4px 0 0}
#staff{background:#fffdf8;border-radius:12px;margin-top:6px}
#staff svg{width:100%;height:clamp(140px,30vh,330px);display:block}
.sl{stroke:#2c3440;stroke-width:1.3}
.clef{font-family:"Segoe UI Symbol","Noto Music","Bravura Text",serif;fill:#1d2430}
.ts{font:700 30px Georgia,serif;fill:#1d2430}
.lab{font:700 17px system-ui,sans-serif}
.qbox{fill:#eef3ff;stroke:var(--acc);stroke-width:1.5;stroke-dasharray:4 3}
.qm{font:700 24px system-ui;fill:var(--acc)}
#fb{min-height:26px;font-size:19px;font-weight:650;text-align:center;margin-top:4px}
#fb.ok{color:var(--ok)}#fb.bad{color:var(--bad)}
#choices{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
#choices button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
#choices button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
#actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
#kbwrap{overflow-x:auto;padding:8px}
#kb{position:relative;height:clamp(120px,22vh,200px);min-width:980px;user-select:none;-webkit-user-select:none;touch-action:none}
.key{position:absolute;top:0;border-radius:0 0 7px 7px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;padding-bottom:7px;font-size:12px;cursor:pointer;transition:background .06s}
.white{height:100%;background:#fff;border:1px solid #9aa3ad;z-index:1;color:#333}
.black{height:62%;background:#1b1f26;z-index:2;color:#ddd;border:1px solid #000;font-size:10px}
.white.down{background:#dfe4ea}.black.down{background:#4a525e}
.key.right{background:var(--ok)!important;color:#fff}
.key.wrong{background:var(--bad)!important;color:#fff}
.white.hint{animation:hw .7s infinite alternate}.black.hint{animation:hb .7s infinite alternate}
@keyframes hw{from{background:#fff}to{background:#8fe0ad}}
@keyframes hb{from{background:#1b1f26}to{background:#1f9d55}}
.mid::before{content:"";position:absolute;top:0;left:15%;right:15%;height:5px;background:#e07a3f;border-radius:0 0 3px 3px}
.lt{font:700 11px monospace;border:1px solid #9aa3ad;border-radius:4px;padding:1px 4px;background:#f6f6f6;color:#333}
.black .lt{background:#333;color:#eee;border-color:#666}
.nm{font-weight:700}
#bMet.live{background:var(--acc);color:#fff;border-color:var(--acc);font-variant-numeric:tabular-nums}
.bpm{font:700 46px Georgia,serif;text-align:center}
.dots{display:flex;gap:10px;justify-content:center;margin:8px 0}.dots span{width:22px;height:22px;border-radius:50%;background:var(--line)}.dots span.on{background:var(--acc)}.dots span.on.one{background:var(--bad)}
.meter{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .05s}
.heard{font:700 40px Georgia,serif;text-align:center;min-height:52px}
#bMic.live{background:var(--bad);border-color:var(--bad)}
.ov{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9}
.ov.show{display:flex}
.box{background:var(--card);border-radius:16px;max-width:680px;width:94%;max-height:88vh;overflow:auto;padding:18px 20px}
.box h2{margin:0 0 8px;font-size:20px}
.box h3{margin:16px 0 6px;font-size:15px}
pre.tip{background:var(--tip);padding:10px 12px;border-radius:10px;white-space:pre-wrap;font:15px/1.5 system-ui,sans-serif;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label.set{display:flex;gap:8px;align-items:center;margin:8px 0}
.small{font-size:13px;color:var(--mut)}

/* ===== Piano Studio look ===== */
:root{--bg:#f3f1ec;--card:#fff;--ink:#18202b;--mut:#6b7280;--line:#e4e0d6;--acc:#2f5bea;--acc2:#e9eefe;--ok:#16a34a;--bad:#dc2626;--tip:#f5f3ee;--shadow:0 1px 2px #0000000a,0 8px 24px #0000000d}
html.dark{--bg:#0f141a;--card:#171e26;--ink:#e6ebf1;--mut:#93a0ae;--line:#283340;--acc:#6d8cff;--acc2:#1e2a48;--ok:#22c55e;--bad:#f05252;--tip:#1f2833;--shadow:0 1px 2px #0006,0 8px 24px #0005}
body{font-family:Inter,system-ui,"Segoe UI",sans-serif}
button{transition:background .15s,border-color .15s,transform .06s}button:active{transform:scale(.97)}
header.top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:9px 18px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--ink);color:var(--card);display:grid;place-items:center;font:30px/1 "Segoe UI Symbol","Noto Music",serif}
.brand b{display:block;font-size:16px}.brand small{color:var(--mut);font-size:12px}
.modes{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.modes button{border:0;background:transparent;border-radius:9px;padding:7px 18px;font-weight:650;color:var(--mut)}
.modes button:hover{color:var(--ink)}
.modes button.on{background:var(--acc);color:#fff}
.tools{justify-self:end;display:flex;gap:6px;align-items:center}
.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:16px}
.pill{border-radius:999px;font-weight:600;padding:7px 14px}
#bMic{font-variant-numeric:tabular-nums}
#bMic.live{background:var(--ok);border-color:var(--ok);color:#fff}
main{max-width:1400px;padding:12px 16px 6px}
.card{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:12px 16px}
.lvbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#title{font-size:18px;font-weight:750;margin:0 6px 0 0}
#title select{font:inherit;font-size:14px;border-radius:8px;padding:2px 6px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
#bLevel,#bLearn{font-size:13px;padding:5px 12px}
#info{margin-left:auto;gap:6px}
#info span{background:var(--tip);border-radius:999px;padding:4px 11px;font-size:13px}
#prog{display:flex;gap:4px;margin:10px 0 0;min-height:6px}
#prog i{flex:1;min-width:4px;height:6px;border-radius:4px;background:var(--line)}
#prog i.ok{background:var(--ok)}#prog i.bad{background:var(--bad)}#prog i.now{background:var(--acc)}
#staff{background:#fffdf8;border:1px solid #ece7da;margin-top:10px}
#fb{font-size:20px;margin-top:8px}
#fb.ok::before{content:"✓ "}#fb.bad::before{content:"✗ "}
#actions button,#choices button{border-radius:999px;padding:8px 16px}
#actions button.pri{box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 35%,transparent)}
#kbwrap{padding:10px}
.white.mapped:not(.down){background:linear-gradient(#fff 72%,#e8edff)}
.nm.oct{font-size:10px;color:#9aa3ad;font-weight:600}
.hint-line{text-align:center;font-size:12px;color:var(--mut);margin-top:6px}
.hint-line b{color:var(--ink);font-weight:650}
.ov{backdrop-filter:blur(3px)}
.box{border-radius:20px;box-shadow:0 24px 70px #0005;animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(6px) scale(.98);opacity:0}}
#levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:0;overflow:visible}
#levels button{white-space:normal;text-align:left;padding:12px 14px;border-radius:14px;display:flex;flex-direction:column;gap:3px;font-size:14px}
#levels button .n{font-size:11px;letter-spacing:.06em;color:var(--mut);font-weight:750}
#levels button.on{background:var(--acc2);border-color:var(--acc);color:var(--ink)}
#levels .best{font-size:12px;color:var(--ok);font-weight:650}
.welcome .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.welcome .choices button{padding:18px;border-radius:16px;text-align:left;font-size:14px;color:var(--mut)}
.welcome .choices button:hover{border-color:var(--acc);background:var(--acc2)}
.welcome .choices .big{font-size:30px}.welcome .choices b{display:block;font-size:17px;margin:6px 0 4px;color:var(--ink)}
@media(max-width:1050px){header.top{grid-template-columns:1fr auto}.modes{order:3;grid-column:1/-1;justify-self:center}}

/* ===== phone (Android) ===== */
#rot,#kbnav{display:none}
#kbcard{padding:0}
html.phone header.top{grid-template-columns:auto 1fr;gap:6px;padding:4px 8px}
html.phone .brand{display:none}
html.phone .modes{order:0;grid-column:auto;justify-self:start}
html.phone .modes button{padding:5px 10px;font-size:13px}
html.phone .tools{gap:4px}
html.phone .icon{width:32px;height:32px;font-size:14px}
html.phone .pill{padding:5px 10px;font-size:13px}
html.phone main{padding:6px 6px 4px}
html.phone .card{padding:8px 10px;border-radius:14px;margin-bottom:6px}
html.phone #kbcard{padding:6px}
html.phone #title{font-size:15px}
html.phone #info span{font-size:11px;padding:2px 8px}
html.phone #prog{margin-top:6px}
html.phone #staff{margin-top:6px}
html.phone #staff svg{height:clamp(110px,36vh,240px)}
html.phone #fb{font-size:16px;min-height:22px;margin-top:4px}
html.phone #actions button,html.phone #choices button{padding:6px 12px;font-size:13px}
html.phone #kbwrap{padding:0;overflow-x:auto;scrollbar-width:none}
html.phone #kbwrap::-webkit-scrollbar{display:none}
html.phone #kb{min-width:0;width:calc(100% * 35 / 15);height:clamp(100px,30vh,170px)}
html.phone .hint-line{display:none}
html.phone .lt{display:none!important}
html.phone #kbnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px;font-size:12px;color:var(--mut)}
html.phone #kbnav button{padding:4px 14px;font-size:13px}
html.phone .box{width:98%;max-height:94vh;padding:14px}
#bFull{display:none}
html.phone #bFull{display:grid}
html.phone #prog{display:none}
html.phone .lvbar{gap:4px}
html.phone #bLevel,html.phone #bLearn{padding:3px 9px;font-size:12px}
html.phone #staff svg{height:clamp(90px,30vh,200px)}
html.phone #fb{margin-top:2px}
html.phone #actions{margin-top:3px}
html.phone #kb{height:clamp(90px,28vh,170px)}
html.phone #kbnav{margin-bottom:3px}
html.phone #kbnav button{padding:2px 12px;font-size:12px}
@media(orientation:landscape) and (max-height:500px){
 html.phone header.top{padding:2px 8px}
 html.phone .modes{padding:2px}html.phone .modes button{padding:3px 10px}
 html.phone .icon{width:28px;height:28px}html.phone .pill{padding:3px 9px}
 html.phone main{padding:4px 6px 2px}
 html.phone .card{padding:5px 10px;margin-bottom:4px}
 html.phone #kbcard{padding:4px 6px}
 html.phone #staff{margin-top:3px}
 html.phone #staff svg{height:26vh}
 html.phone #fb{font-size:14px;min-height:18px}
 html.phone #actions button,html.phone #choices button{padding:3px 10px}
 html.phone #kbnav{margin-bottom:2px}html.phone #kbnav button{padding:1px 10px}
 html.phone #kb{height:30vh}
}
@media(orientation:portrait){html.phone header.top{grid-template-columns:1fr}html.phone .tools{justify-self:start;flex-wrap:wrap}}
@media(orientation:portrait){html.phone #rot{display:block;background:var(--acc2);text-align:center;padding:6px;font-size:13px;border-radius:10px;margin-bottom:6px}}

/* ===== phone play view: only staff + keys while a song plays ===== */
html.phone.play header.top,html.phone.play .lvbar,html.phone.play #prog,html.phone.play #kbnav,html.phone.play #rot{display:none}
html.phone.play main{padding:2px 4px}
html.phone.play .card{box-shadow:none;border:0;padding:2px 4px;margin:0;background:transparent}
html.phone.play #staff{margin-top:2px}
html.phone.play #staff svg{height:58vh}
html.phone.play #fb{position:fixed;top:6px;right:10px;left:auto;max-width:48%;text-align:right;font-size:14px;margin:0;pointer-events:none;z-index:6}
html.phone.play #actions{position:fixed;top:6px;left:8px;z-index:7;margin:0;justify-content:flex-start;max-width:52%}
html.phone.play #actions button{box-shadow:0 2px 8px #0002}html.phone.play #actions button:not(.pri){background:var(--card)}
html.phone.play #actions button.big{width:46px;height:46px;border-radius:50%;padding:0;font-size:18px}
/* ===== app screens (Home and its branches) ===== */
#app{position:fixed;inset:0;z-index:8;background:var(--bg);overflow:auto;display:none}
html.home #app{display:block}
html.home body{overflow:hidden}
.scr{max-width:820px;margin:auto;padding:16px 16px 48px}
.brandbig{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.brandbig .logo{font-size:40px;line-height:1}
.brandbig b{display:block;font-size:24px}.brandbig small{color:var(--mut)}
.cont{width:100%;padding:14px;font-size:16px;font-weight:700;border-radius:14px;margin-bottom:12px}
.path,.list{display:grid;gap:8px}
.step,.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);color:var(--ink)}
.step{padding:14px 16px;border-radius:16px}
.step.next{border:2px solid var(--acc)}
.num{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--acc2);color:var(--acc);font-weight:800}
.step .num{width:42px;height:42px;font-size:18px}
.done>.num{background:var(--ok);color:#fff}
.tx{min-width:0}.tx b{display:block;font-size:16px}.tx small{color:var(--mut);font-size:13px}
.step .tx b{font-size:18px}
.go{margin-left:auto;color:var(--mut);font-size:22px;padding-left:8px}
.r{margin-left:auto;color:var(--mut);font-weight:700}
.grp{margin:18px 0 8px;font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{text-transform:none;letter-spacing:0;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--acc2);color:var(--acc)}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tools2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tools2 button{padding:12px;border-radius:12px;text-align:left}
.scr-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.scr-top h2{margin:0;font-size:21px}
.sub{color:var(--mut);font-size:14px;margin:4px 0 12px}
.lrow{display:flex;gap:8px}.lrow .item{flex:1}
.lrow .sc{flex:none;border-radius:14px;padding:0 14px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item.big{padding:14px}.item .ic{font-size:28px}
.item.on{border:2px solid var(--acc);background:var(--acc2)}
.item:disabled{opacity:.5}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-top:6px;font-size:14px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:8px;font-weight:650}
.seg button.on{background:var(--acc);color:#fff}
@media(max-width:560px){.two{grid-template-columns:1fr}.scr{padding:10px 10px 40px}.step .tx b{font-size:16px}}
/* ===== smaller keyboard, bigger staff (18 Nov) ===== */
#staff svg{height:clamp(180px,44vh,460px)}
#kb{height:clamp(80px,14vh,130px)}
html.phone #staff svg{height:clamp(120px,42vh,280px)}
html.phone #kb{height:clamp(70px,20vh,120px)}
@media(orientation:landscape) and (max-height:500px){html.phone #staff svg{height:36vh}html.phone #kb{height:22vh}}
html.phone.play #staff svg{height:64vh}
/* ===== message + buttons in one row above the staff (18 Nov) ===== */
#bar2{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;margin-top:6px}
#bar2 #fb{margin:0;text-align:left;font-size:17px;min-height:0;flex:1 1 220px}
#bar2 #actions{margin:0;justify-content:flex-end}
#bar2 #actions button{padding:6px 14px}
#staff svg{height:clamp(200px,50vh,520px)}
html.phone #bar2 #fb{font-size:14px}
html.phone #staff svg{height:clamp(130px,46vh,300px)}
@media(orientation:landscape) and (max-height:500px){html.phone #staff svg{height:40vh}}
/* ===== phone-first UX pass (19 Nov) ===== */
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
html.phone body{overscroll-behavior:none}
.white.c{border-left:2px solid #7d8794}
.nm.oct{font-size:11px;color:#6b7380}
.mid .nm{color:#c2410c!important;font-size:12px}
.gx{background:#fffdf8;border-radius:10px;margin:6px 0}
.gx svg{width:100%;height:120px;display:block}
.gsec{border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:0 12px;background:var(--card)}
.gsec>summary{cursor:pointer;padding:12px 0;font-weight:700;list-style:none}
.gsec>summary::before{content:"▸ ";color:var(--acc)}.gsec[open]>summary::before{content:"▾ "}
.gsec[open]{padding-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.stats div{background:var(--tip);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:18px}.stats small{color:var(--mut);font-size:12px}
.okline{color:var(--ok);font-weight:700}
.mx{border:1px solid var(--line);border-radius:12px;margin:6px 0;padding:0 12px}
.mx>summary{cursor:pointer;padding:10px 0;list-style:none}
.mx>summary::before{content:"▸ ";color:var(--acc)}.mx[open]>summary::before{content:"▾ "}
.adv{margin-top:14px}.adv>summary{cursor:pointer;color:var(--mut);font-weight:650;padding:6px 0}
.item.on .tx small{color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.white.hint{background:#8fe0ad!important}.black.hint{background:#1f9d55!important}}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats div:last-child{grid-column:1/-1}}
/* ===== practice bar: back · title · progress · menu (19 Nov) ===== */
header.top{display:flex!important;align-items:center;gap:8px;flex-wrap:nowrap}
html.inapp .brand{display:none}
.modes{order:0!important;flex:none}
.ptitle{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:12px;overflow:hidden;white-space:nowrap}
.ptitle #title{font-weight:700;font-size:16px;margin:0;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ptitle #info{display:flex;gap:10px;font-size:14px;color:var(--mut);flex:none}
.ptitle #info span{background:none;padding:0}
.tools{flex:none;flex-wrap:nowrap}
#bMic:not(.live),#bMet:not(.live){display:none}
.lvbar{display:none!important}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.mlist button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;text-align:left;font-size:15px}

</main>

<script>
// ---------- basics ----------
const $=id=>document.getElementById(id);
const LOW=36, HIGH=95;            // C2 .. B6 (35 white keys)
const ROUND=20, s=14;              // questions per round, staff line gap
const PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11}, LET='CDEFGAB';
const SH=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const FL=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const midiOf=n=>(n.o+1)*12+PC[n.L]+n.a;
const stepOf=n=>n.o*7+LET.indexOf(n.L);
const isBlack=m=>[1,3,6,8,10].includes(m%12);
const oct=m=>Math.floor(m/12)-1;
const nameM=m=>SH[m%12]+oct(m);
const nameFull=m=>isBlack(m)?SH[m%12]+oct(m)+' / '+FL[m%12]+oct(m):nameM(m);
const nameN=n=>n.L+(n.a>0?'♯':n.a<0?'♭':'')+n.o;
const rand=a=>a[Math.floor(Math.random()*a.length)];
function nat(m){const L=Object.keys(PC).find(k=>PC[k]===m%12);return L?{L,o:oct(m),a:0}:null}
function nats(lo,hi){const r=[];for(let m=lo;m<=hi;m++){const n=nat(m);if(n)r.push(n)}return r}
const load=k=>{try{return JSON.parse(localStorage.getItem('pnr_'+k))}catch(e){return null}};
const store=(k,v)=>{try{localStorage.setItem('pnr_'+k,JSON.stringify(v))}catch(e){}};

const PHONE=matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<=820;
if(PHONE)document.documentElement.classList.add('phone');
const S=Object.assign({names:false,letters:true,auto:true,all:false,timer:0,vol:0.8,mute:false,oct:3,dark:false},load('set')||{});
const P=Object.assign({unlocked:1,best:{},miss:{},seen:{}},load('prog')||{});
if(S.ver!==3){S.oct=4;S.ver=3}
if(S.grand==null)S.grand=true;   // always draw both staffs; the one not in use is faded
const GR=()=>S.grand&&!PHONE;   // phone: only the staff in use, so notes are bigger
const effV=v=>GR()?'grand':v;
const playView=on=>document.documentElement.classList.toggle('play',!!on&&PHONE);
if(PHONE)S.letters=false;   // no laptop letter keys on a phone
const saveS=()=>store('set',S), saveP=()=>store('prog',P);

// ---------- levels ----------
const TIPS={
 mc:'Middle C = C4. On the keyboard: the C just left of a group of 2 black keys, near the middle. It has an orange mark here.',
 tl:'Treble LINES, bottom to top: E G B D F\n"Every Good Boy Does Fine"',
 ts:'Treble SPACES, bottom to top: F A C E\nIt spells FACE',
 bl:'Bass LINES, bottom to top: G B D F A\n"Good Boys Do Fine Always"',
 bs:'Bass SPACES, bottom to top: A C E G\n"All Cows Eat Grass"'
};
const L=[null,
 {t:'Treble: C D E F G',type:'note',view:'treble',pool:()=>nats(60,67),tips:['mc'],
  learn:'The treble clef 𝄞 is for high notes. The right hand plays most of them.\nMiddle C sits on a short extra line below the staff.\nC D E F G go up one step at a time: line, space, line, space, line.'},
 {t:'Treble: C4 to C5',type:'note',view:'treble',pool:()=>nats(60,72),tips:['tl','ts'],
  learn:'One step up = from a line to the next space, or a space to the next line.\nLearn lines and spaces as two groups.'},
 {t:'Treble: full staff',type:'note',view:'treble',pool:()=>nats(57,76),tips:['tl','ts'],
  learn:'Short extra lines above or below the staff are called ledger lines.\nA3 and B3 sit below Middle C.\nE5 is the space above the top line.'},
 {t:'Bass: C3 to C4',type:'note',view:'bass',pool:()=>nats(48,60),tips:['bl','bs','mc'],
  learn:'The bass clef 𝄢 is for low notes. The left hand plays most of them.\nIts two dots sit around the F line (F3).\nMiddle C is now on a ledger line ABOVE the staff.'},
 {t:'Bass: full staff',type:'note',view:'bass',pool:()=>nats(41,60),tips:['bl','bs'],
  learn:'Bass bottom line = G2. Top line = A3.\nF2 is the space just below the staff.'},
 {t:'Grand staff',type:'note',view:'grand',pool:()=>nats(41,76),tips:['tl','ts','bl','bs'],
  learn:'Grand staff = treble on top + bass below, joined on the left.\nMiddle C sits between them.\nNotes on top = right hand. Notes below = left hand.'},
 {t:'Sharps and flats',type:'acc',view:'grand',tips:['mc'],
  learn:'♯ sharp = the very next key to the RIGHT (higher).\n♭ flat = the very next key to the LEFT (lower).\nOne black key has two names: C♯ = D♭.\nE♯ = F and B♯ = C — not every sharp is a black key.'},
 {t:'Key signatures',type:'key',view:'treble',tips:['tl','ts'],
  learn:'Sharps or flats at the start of the line = key signature.\nThey apply to EVERY note with that letter, in the whole piece.\nG major: F♯\nD major: F♯ C♯\nF major: B♭\nB♭ major: B♭ E♭'},
 {t:'Note values',type:'val',view:'treble',tips:[],
  learn:'The shape tells how long a note lasts, in beats.\nWhole = 4 · Half = 2 · Quarter = 1 · Eighth = ½\nHollow head = long. Filled head = short. A flag halves it.\nA rest = silence for the same time.'},
 {t:'Counting bars',type:'bar',view:'treble',tips:[],
  learn:'Time signature: TOP number = beats in one bar.\nBottom 4 = one beat is a quarter note.\nEvery bar must add up to the top number.\nFind the note that fills the empty box.'},
 {t:'Short melodies',type:'mel',view:'treble',tips:['tl','ts'],
  learn:'Now read note after note, left to right.\nThe blue note is the one to play.\nTry to keep going — do not stop too long on one note.'}
];
const KS=[{nm:'G major',sig:[['F',1]]},{nm:'D major',sig:[['F',1],['C',1]]},{nm:'F major',sig:[['B',-1]]},{nm:'B♭ major',sig:[['B',-1],['E',-1]]}];
const SIGSTEP={F:38,C:35,B:34,E:37};
const VALS=[
 {lab:'Whole note',b:4,dur:'w'},{lab:'Half note',b:2,dur:'h'},{lab:'Quarter note',b:1,dur:'q'},{lab:'Eighth note',b:.5,dur:'e'},
 {lab:'Whole rest',b:4,dur:'w',rest:1},{lab:'Half rest',b:2,dur:'h',rest:1},{lab:'Quarter rest',b:1,dur:'q',rest:1},{lab:'Eighth rest',b:.5,dur:'e',rest:1}];
const BAROPT=[{v:.5,lab:'Eighth (½)',dur:'e'},{v:1,lab:'Quarter (1)',dur:'q'},{v:2,lab:'Half (2)',dur:'h'},{v:3,lab:'Dotted half (3)',dur:'h',dot:1},{v:4,lab:'Whole (4)',dur:'w'}];
const DURV={e:.5,q:1,h:2,w:4};
const bstr=b=>b===.5?'½':String(b);

// ---------- sound: electric-piano style (FM) ----------
let ctx,master;const voices=new Map();
function ac(){if(!ctx){const C=window.AudioContext||window.webkitAudioContext;ctx=new C();const comp=ctx.createDynamicsCompressor();master=ctx.createGain();master.gain.value=S.vol;master.connect(comp);comp.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();return ctx}
function noteOn(m,vel=.9){
  if(S.mute)return;if(MIC.on)MIC.lock=Date.now()+900;ac();killVoice(m);
  const t=ctx.currentTime,f=440*2**((m-69)/12);
  const car=ctx.createOscillator(),mod=ctx.createOscillator(),mg=ctx.createGain(),amp=ctx.createGain();
  car.frequency.value=f;mod.frequency.value=f;
  mg.gain.setValueAtTime(f*1.5*vel,t);mg.gain.exponentialRampToValueAtTime(f*.12+1,t+1.4);
  mod.connect(mg);mg.connect(car.frequency);
  const bell=ctx.createOscillator(),bg=ctx.createGain();bell.frequency.value=f*7;
  bg.gain.setValueAtTime(.035*vel,t);bg.gain.exponentialRampToValueAtTime(.0001,t+.18);bell.connect(bg);bg.connect(amp);
  const pk=.3*vel*(m<55?1.2:1);
  amp.gain.setValueAtTime(.0001,t);amp.gain.exponentialRampToValueAtTime(pk,t+.006);
  amp.gain.exponentialRampToValueAtTime(pk*.4,t+.8);amp.gain.exponentialRampToValueAtTime(.0001,t+6);
  car.connect(amp);amp.connect(master);
  const os=[car,mod,bell];os.forEach(o=>{o.start(t);o.stop(t+6.1)});
  voices.set(m,{amp,os});
}
function stopVoice(v,tc,end){const t=ctx.currentTime;v.amp.gain.cancelScheduledValues(t);v.amp.gain.setValueAtTime(Math.max(v.amp.gain.value,.0001),t);v.amp.gain.setTargetAtTime(.0001,t,tc);v.os.forEach(o=>{try{o.stop(t+end)}catch(e){}})}
function killVoice(m){const v=voices.get(m);if(v){voices.delete(m);stopVoice(v,.008,.05)}}
function noteOff(m){const v=voices.get(m);if(v){voices.delete(m);stopVoice(v,.13,1)}}
function playFor(m,ms=700){if(MIC.on)MIC.lock=Date.now()+ms+700;noteOn(m);lit(m,1);setTimeout(()=>{noteOff(m);lit(m,0)},ms)}
function click(strong){if(S.mute)return;ac();const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=strong?1400:950;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);o.connect(g);g.connect(master);o.start(t);o.stop(t+.06)}
function lit(m,on){const k=KEY[m];if(k)k.classList.toggle('down',!!on)}

// ---------- keyboard ----------
// phone: the keyboard shows about 2 octaves and moves to the note in play
function kbFocus(m,force){if(!PHONE)return;const w=$('kbwrap'),k=KEY[m];if(!k)return;
  const kl=k.offsetLeft,kw=k.offsetWidth,vl=w.scrollLeft,vw=w.clientWidth;
  if(!force&&kl>vl+vw*.12&&kl+kw<vl+vw*.88)return;w.scrollTo({left:kl+kw/2-vw/2,behavior:force?'auto':'smooth'});setTimeout(kbRange,450)}
function kbRange(){if(!PHONE)return;const w=$('kbwrap'),vis=[];for(let m=LOW;m<=HIGH;m++){const k=KEY[m];if(k&&!isBlack(m)&&k.offsetLeft>=w.scrollLeft-2&&k.offsetLeft+k.offsetWidth<=w.scrollLeft+w.clientWidth+2)vis.push(m)}
  $('kbRange').textContent=vis.length?nameM(vis[0])+' – '+nameM(vis[vis.length-1]):''}
function kbMove(d){const w=$('kbwrap');w.scrollBy({left:d*w.scrollWidth*7/35,behavior:'smooth'});setTimeout(kbRange,450)}
const KEY={};const down=new Set();
function buildKeys(){
  const kb=$('kb');kb.innerHTML='';let n=0;for(let m=LOW;m<=HIGH;m++)if(!isBlack(m))n++;
  const W=100/n;let wi=0;
  for(let m=LOW;m<=HIGH;m++){
    const el=document.createElement('div');
    if(!isBlack(m)){el.className='key white';el.style.left=wi*W+'%';el.style.width=W+'%';wi++}
    else{el.className='key black';el.style.left=(wi*W-W*.31)+'%';el.style.width=W*.62+'%'}
    if(m===60)el.classList.add('mid');if(m%12===0)el.classList.add('c');
    el.innerHTML='<span class="nm"></span><span class="lt"></span>';
    el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}press(m)});
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>release(m)));
    kb.append(el);KEY[m]=el;
  }
  labelKeys();
}
// One continuous row. A = C. Right hand: A = C4. Left hand: A = C3.
const MAP={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,';':16,"'":17,']':18};
const base=()=>(S.oct+1)*12;   // S.oct = octave of the A key
function keyToMidi(k){return k in MAP?base()+MAP[k]:null}
const inMap=(m,o)=>Object.values(MAP).includes(m-(o+1)*12);
function labelKeys(){
  const map={};for(const k in MAP)map[base()+MAP[k]]=k.toUpperCase();
  for(let m=LOW;m<=HIGH;m++){const el=KEY[m];if(!el)continue;
    const lt=el.querySelector('.lt'),nm=el.querySelector('.nm');
    lt.textContent=S.letters&&map[m]?map[m]:'';lt.style.display=lt.textContent?'':'none';
    nm.textContent=S.names?(isBlack(m)?SH[m%12]:nameM(m)):(m%12===0?nameM(m):'');nm.className=S.names||m===60?'nm':'nm oct';
    el.classList.toggle('mapped',!!(S.letters&&map[m]));}
  info();
}
function shiftOct(d){const n=Math.min(5,Math.max(2,S.oct+d));if(n!==S.oct){releaseAll();S.oct=n;saveS();labelKeys()}}
function handOf(m){const v=G.mode==='level'?L[G.lv].view:G.mode==='scroll'?SC.view:'grand';return v==='bass'||(v==='grand'&&m<60)?'left':'right'}
function autoOct(m){kbFocus(m);if(!S.auto||!S.letters)return;const pref=handOf(m)==='left'?3:4;
  const c=[pref,pref-1,pref+1,pref-2,pref+2].filter(o=>o>=2&&o<=5&&m>=(o+1)*12&&m<=(o+1)*12+18);
  if(!c.length||c[0]===S.oct)return;if(!SC.tempo)releaseAll();S.oct=c[0];saveS();labelKeys()}
function press(m){if(down.has(m))return;down.add(m);noteOn(m);lit(m,1);judge(m)}
function release(m){if(!down.has(m))return;down.delete(m);noteOff(m);lit(m,0);if(SC.tempo)tempoRelease(m,'key')}
function releaseAll(){[...down].forEach(release);held.clear()}
function flash(m,c){const k=KEY[m];if(!k)return;k.classList.remove('right','wrong');void k.offsetWidth;k.classList.add(c);setTimeout(()=>k.classList.remove(c),600)}
function hint(m){clearHints();KEY[m]?.classList.add('hint')}
function clearHints(){document.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'))}

// ---------- staff drawing ----------
function tops(view){return view==='grand'?{treble:55,bass:175}:{[view]:95}}
const REF={treble:30,bass:18}; // bottom-line step: E4, G2
function yOf(st,c,T){return T[c]+4*s-(st-REF[c])*s/2}
function svgStaff({view,notes=[],sig=null,time=null,barX=null,bars=[],extra='',W=600}){
  let focus=null;if(view!=='grand'&&GR()){focus=view;view='grand';notes=notes.map(n=>n.clef?n:{...n,clef:focus})}
  const T=tops(view),H=view==='grand'?300:250;let o='';
  for(const c in T){let q='';
    for(let i=0;i<5;i++)q+=`<line class="sl" x1="18" x2="${W-10}" y1="${T[c]+i*s}" y2="${T[c]+i*s}"/>`;
    q+=c==='treble'?`<text class="clef" x="22" y="${T[c]+4*s+3}" font-size="66">𝄞</text>`
                   :`<text class="clef" x="24" y="${T[c]+3*s+9}" font-size="58">𝄢</text>`;
    q+=`<line class="sl" x1="${W-10}" x2="${W-10}" y1="${T[c]}" y2="${T[c]+4*s}"/>`;
    o+=focus&&c!==focus?`<g opacity=".25">${q}</g>`:q;
  }
  o+=`<line class="sl" x1="18" x2="18" y1="${view==='grand'?55:T[view]}" y2="${view==='grand'?175+4*s:T[view]+4*s}" stroke-width="2"/>`;
  if(sig)sig.forEach(([L,a],i)=>{const y=yOf(SIGSTEP[L],'treble',T);o+=`<text x="${78+i*13}" y="${y+(a>0?8:5)}" font-size="${a>0?28:36}" fill="#1d2430">${a>0?'♯':'♭'}</text>`});
  if(time){const c=focus||Object.keys(T)[0];o+=`<text class="ts" text-anchor="middle" x="90" y="${T[c]+2*s-2}">${time}</text><text class="ts" text-anchor="middle" x="90" y="${T[c]+4*s-2}">4</text>`}
  if(barX){const c=focus||Object.keys(T)[0];o+=`<line class="sl" x1="${barX}" x2="${barX}" y1="${T[c]}" y2="${T[c]+4*s}" stroke-width="2"/>`}
  bars.forEach(bx=>{for(const c in T)o+=`<line class="sl" x1="${bx}" x2="${bx}" y1="${T[c]}" y2="${T[c]+4*s}"/>`});
  o+=extra;
  for(const nt of notes){
    const c=nt.clef||(view==='grand'?(midiOf(nt.n)>=60?'treble':'bass'):view);
    if(nt.box){o+=`<rect class="qbox" x="${nt.x-16}" y="${T[c]-6}" width="32" height="${4*s+12}" rx="6"/><text class="qm" text-anchor="middle" x="${nt.x}" y="${T[c]+2*s+8}">?</text>`;continue}
    if(nt.rest){o+=restSVG(nt,T[c]);continue}
    o+=noteSVG(nt,c,T);
  }
  return `<svg viewBox="${PHONE&&view!=='grand'?`0 30 ${W} 200`:`0 0 ${W} ${H}`}" xmlns="http://www.w3.org/2000/svg">${o}</svg>`;
}
function noteSVG(nt,c,T){
  const n=nt.n,col=nt.color||'#1d2430',st=stepOf(n),y=yOf(st,c,T),x=nt.x,ref=REF[c];let o='';
  for(let l=ref-2;l>=st;l-=2){const ly=yOf(l,c,T);o+=`<line class="sl" x1="${x-14}" x2="${x+14}" y1="${ly}" y2="${ly}"/>`}
  for(let l=ref+10;l<=st;l+=2){const ly=yOf(l,c,T);o+=`<line class="sl" x1="${x-14}" x2="${x+14}" y1="${ly}" y2="${ly}"/>`}
  if(n.a&&!nt.hideAcc)o+=`<text x="${x-27}" y="${y+(n.a>0?8:5)}" font-size="${n.a>0?28:36}" fill="${col}">${n.a>0?'♯':'♭'}</text>`;
  const d=nt.dur||'q',hollow=d==='h'||d==='w',up=st<ref+4;
  o+=`<ellipse cx="${x}" cy="${y}" rx="${d==='w'?8.6:7.6}" ry="5.6" transform="rotate(-20 ${x} ${y})" fill="${hollow?'#fff':col}" stroke="${col}" stroke-width="${hollow?2.6:1}"/>`;
  if(d!=='w'){const sx=up?x+6.7:x-6.7,ey=up?y-3.5*s:y+3.5*s;
    o+=`<line x1="${sx}" x2="${sx}" y1="${y}" y2="${ey}" stroke="${col}" stroke-width="1.8"/>`;
    if(d==='e')o+=up?`<path d="M${sx} ${ey} q3 10 11 14 q4 5 0 15" stroke="${col}" stroke-width="2.4" fill="none"/>`
                    :`<path d="M${sx} ${ey} q3 -10 11 -14 q4 -5 0 -15" stroke="${col}" stroke-width="2.4" fill="none"/>`;}
  if(nt.dot)o+=`<circle cx="${x+15}" cy="${(st-ref)%2===0?y-s/2:y}" r="2.8" fill="${col}"/>`;
  if(nt.label){const ly=(d==='w'||up)?Math.max(y+30,T[c]+4*s+26):Math.min(y-18,T[c]-12);
    o+=`<text class="lab" text-anchor="middle" x="${x}" y="${ly}" fill="${nt.labCol||col}">${nt.label}</text>`}
  return o;
}
function restSVG(nt,top){
  const x=nt.x,c=nt.color||'#1d2430',Li=i=>top+i*s;
  if(nt.dur==='w')return `<rect x="${x-9}" y="${Li(1)}" width="18" height="7" fill="${c}"/>`;
  if(nt.dur==='h')return `<rect x="${x-9}" y="${Li(2)-7}" width="18" height="7" fill="${c}"/>`;
  if(nt.dur==='q')return `<path d="M${x-4} ${Li(0)+5} l8 10 l-7 8 l8 10 q-10 -4 -6 9" stroke="${c}" stroke-width="3.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
  return `<circle cx="${x-4}" cy="${Li(1)+5}" r="3.6" fill="${c}"/><path d="M${x-4} ${Li(1)+7} q7 3 11 -4 l-9 ${2*s+2}" stroke="${c}" stroke-width="2.2" fill="none"/>`;
}

// ---------- game state ----------
let G={lv:1,mode:'level',phase:'ask',mist:0,q:null,mel:null,round:{n:0,good:0,miss:{}},nextFn:null,free:null,timer:null,tLeft:0};
function fb(t,c=''){const e=$('fb');e.textContent=t;e.className=c}
function info(){

  if(G.mode==='free'||G.mode==='menu'){$('info').innerHTML=letters;$('prog').innerHTML='';return}
  const tot=G.mode==='scroll'&&SC.src==='song'?SC.notes.filter(x=>!x.rest).length:G.focus&&G.mode==='level'?10:ROUND;

  else p=`<i class="ok" style="flex:0 0 ${100*list.length/tot}%"></i><i></i>`;
  $('prog').innerHTML=p;
}
function renderLevels(){

    b.innerHTML=`<span class="n">${open?'':'🔒 '}LEVEL ${i}</span><b>${L[i].t}</b>${P.best[i]!=null?`<span class="best">Best ${P.best[i]}%</span>`:''}`;
    b.disabled=!open;if(G.lv===i&&G.mode!=='free')b.classList.add('on');
    b.onclick=()=>{close('ovLv');if(G.mode==='scroll'){G.lv=i;startScroll('level')}else setLevel(i)};e.append(b)}
  $('mLevels').classList.toggle('on',G.mode==='level');$('bScroll').classList.toggle('on',G.mode==='scroll');$('bFree').classList.toggle('on',G.mode==='free');
  $('bLevel').style.display=G.mode==='level'?'':'none';$('bLearn').style.display=G.mode==='level'?'':'none';
}
function actions(list){const e=$('actions');e.innerHTML='';list.forEach(([t,f,cls])=>{const b=document.createElement('button');b.textContent=t;if(cls)b.className=cls;b.onclick=f;e.append(b)})}
function stdActions(){
  if(G.mode==='scroll'&&SC.tempo&&PHONE&&!SC.done&&!SC.paused)return actions([['⏸ Pause',tempoPause],['↺ Restart',restart]]);
  if(G.mode==='scroll'&&SC.tempo)return actions(SC.done?[]:[SC.paused?['▶ Go on'+(PHONE?'':' (Space)'),tempoResume,'pri']:['⏸ Pause'+(PHONE?'':' (Space)'),tempoPause],['⏪ Back 20 s'+(PHONE?'':' (B)'),()=>tempoBack(20)],['↺ Restart',restart],['📖 Guide',openRef],['■ Finish & review',finishEarly]]);
  if(G.mode==='scroll'){const a=[['🔊 Hear next 4',hearAhead],['❓ Show answer',giveUp],['↺ Restart',restart],['■ Finish & review',finishEarly]];if(G.nextFn)a.push(['Next ▶ (Space)',G.nextFn,'pri']);return actions(a)}
  const d=L[G.lv],btn=[['🔊 Listen',listen],['❓ Show answer',giveUp]];
  if(d.type==='val'||d.type==='bar')btn[1]=['❓ Show answer',giveUp];
  if(G.nextFn)btn.push(['Next ▶ (Space)',G.nextFn,'pri']);
  actions(btn);
}
function restart(){releaseAll();if(G.mode==='scroll')startScroll();else if(G.mode==='level'){G.focus?practiseMissed(G.focus):setLevel(G.lv)}}
function finishEarly(){
  if(G.mode==='scroll'&&SC.tempo){SC.done=true;SC.run=(SC.run||0)+1;cancelAnimationFrame(SC.raf);tempoMetOff()}
  clearTimer();releaseAll();if(!G.round.n){go(APP.from);return}summary(true)}
function setNext(f){G.nextFn=f;stdActions()}

function setLevel(lv){tempoStop();playView(0);releaseAll();G.lv=lv;G.mode='level';G.round={n:0,good:0,miss:{}};G.mel=null;G.focus=G.focusNext||null;G.focusNext=null;renderLevels();$('title').textContent=`L${lv} · ${L[lv].t}`+(G.focus?' · missed notes':'');newQ();if(!G.focus&&!P.seen[lv]&&S.hello){P.seen[lv]=1;saveP();openLearn()}}
function weighted(items,keyFn){const w=items.map(it=>1+(P.miss[G.lv+':'+keyFn(it)]||0));let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<items.length;i++){r-=w[i];if(r<=0)return items[i]}return items[0]}
function record(label,first){
  G.round.n++;(G.round.list||(G.round.list=[])).push(!!first);if(first)G.round.good++;else G.round.miss[label]=(G.round.miss[label]||0)+1;
  if(!(G.mode==='scroll'&&SC.src==='song')){const k=G.lv+':'+label;P.miss[k]=Math.max(0,Math.min(6,(P.miss[k]||0)+(first?-1:2)));saveP()}info();
}

function newQ(){
  clearTimer();clearHints();G.mist=0;G.phase='ask';G.nextFn=null;fb('');$('choices').innerHTML='';
  if(G.round.n>=(G.focus?10:ROUND))return summary();
  const d=L[G.lv],last=G.q&&G.q.label;
  if(d.type==='note'){let n;let pool=d.pool();if(G.focus){const f=pool.filter(x=>G.focus.includes(nameN(x)));if(f.length)pool=f}do{n=weighted(pool,nameN)}while(pool.length>1&&nameN(n)===last);
    G.q={n,m:midiOf(n),label:nameN(n)};fb('Find this note.')}
  else if(d.type==='acc'){const items=[];for(let m=48;m<=72;m++){const w=nat(m);if(w)items.push(w);else{items.push({...nat(m-1),a:1});items.push({...nat(m+1),a:-1})}}
    if(G.focus){const f=items.filter(x=>G.focus.includes(nameN(x)));if(f.length)items.splice(0,items.length,...f)}
    let n;do{n=weighted(items,nameN)}while(items.length>1&&nameN(n)===last);
    const m=midiOf(n);G.q={n,m,label:nameN(n)+(isBlack(m)?'':'')};fb(n.a?'Watch the sign before the note.':'Find this note.')}
  else if(d.type==='key'){const ks=rand(KS),pool=nats(60,76);let n;
    if(Math.random()<.55){const L2=ks.sig.map(x=>x[0]);n=rand(pool.filter(p=>L2.includes(p.L)))}else n=rand(pool);
    const sg=ks.sig.find(x=>x[0]===n.L),real={...n,a:sg?sg[1]:0};
    G.q={n,real,ks,m:midiOf(real),label:nameN(real)};fb(`Key: ${ks.nm}. Find this note.`)}
  else if(d.type==='val'){let v;do{v=rand(VALS)}while(G.q&&G.q.v===v);G.q={v,label:v.lab};
    fb('What is this?');VALS.forEach(o=>choiceBtn(`${o.lab} · ${bstr(o.b)}`,o===v,()=>playValue(v)))}
  else if(d.type==='bar'){makeBar();fb(`Time ${G.q.top}/4. Which note fills the bar?`);
    BAROPT.filter(o=>o.v<=G.q.top).forEach(o=>choiceBtn(o.lab,o.v===G.q.gap,()=>{G.q.ans=o;draw();playBar()}))}
  else if(d.type==='mel'){makeMel();fb('Play the blue note. Go left to right.')}
  if(G.q&&G.q.m!=null)autoOct(G.q.m);
  if(d.type==='mel')autoOct(midiOf(G.mel.notes[0]));
  draw();info();stdActions();startTimer();
}
function draw(){if(G.mode==='menu')return;
  if(G.mode==='scroll')return drawScroll();
  const d=L[G.lv];
  if(G.mode==='free'){const v=$('freeClef')?.value||S.freeView||'grand';const notes=G.free!=null?[{n:spellPref(G.free),x:330,dur:'w',label:nameFull(G.free),color:'#1f6feb'}]:[];
    if(v!=='grand'&&notes[0])notes[0].clef=v;$('staff').innerHTML=svgStaff({view:v,notes});return}
  const ans=G.phase==='answer'||G.phase==='done';
  if(['note','acc','key'].includes(d.type)){
    const nt={n:G.q.n,x:330,dur:'w',color:G.phase==='done'&&G.mist===0?'#1f9d55':'#1d2430'};
    if(ans){nt.label=G.q.label;nt.labCol=G.mist>=2?'#d64545':'#1f9d55'}
    $('staff').innerHTML=svgStaff({view:d.view,notes:[nt],sig:d.type==='key'?G.q.ks.sig:null});
  }else if(d.type==='val'){
    const v=G.q.v;$('staff').innerHTML=svgStaff({view:'treble',notes:[{n:{L:'A',o:4,a:0},x:330,dur:v.dur,rest:v.rest}]});
  }else if(d.type==='bar'){
    const q=G.q,notes=[];let x=150;const sp=Math.min(70,380/(q.vals.length+1));
    q.vals.forEach(v=>{notes.push({n:{L:'A',o:4,a:0},x,dur:{.5:'e',1:'q',2:'h'}[v]});x+=sp});
    if(q.ans)notes.push({n:{L:'A',o:4,a:0},x,dur:q.ans.dur,dot:q.ans.dot,color:'#1f9d55'});else notes.push({x,box:1,clef:'treble'});
    $('staff').innerHTML=svgStaff({view:'treble',notes,time:q.top,barX:x+40});
  }else if(d.type==='mel'){
    const M=G.mel,sp=Math.min(70,440/M.notes.length);
    const notes=M.notes.map((n,i)=>{const nt={n,x:120+i*sp+sp/2,dur:'q',color:i<M.i?'#1f9d55':i===M.i?'#1f6feb':'#1d2430'};
      if(i===M.i&&G.phase==='answer'){nt.label=nameN(n);nt.labCol='#d64545'}return nt});
    $('staff').innerHTML=svgStaff({view:'treble',notes});
  }
}
function spellPref(m){const n=nat(m);return n||{...nat(m-1),a:1}}

// ---------- judging ----------
function judge(m){
  if(G.mode==='menu')return;
  if(G.mode==='free'){G.free=m;draw();fb(nameFull(m));return}
  if(G.mode==='scroll')return judgeScroll(m);
  const d=L[G.lv];
  if(['note','acc','key'].includes(d.type))return judgeNote(m,G.q.m,G.q.label,()=>setTimeout(()=>{if(G.mode==='level')newQ()},650));
  if(d.type==='mel'){const M=G.mel;if(!M||M.i>=M.notes.length)return;const n=M.notes[M.i];
    return judgeNote(m,midiOf(n),nameN(n),melStep)}
}
function judgeNote(m,t,label,onDone){
  if(G.phase==='done')return;
  if(G.phase==='answer'){if(m===t){flash(m,'right');clearHints();G.phase='done';onDone()}else flash(m,'wrong');return}
  if(m===t){flash(m,'right');clearTimer();fb('Correct!','ok');G.phase='done';record(label,G.mist===0);draw();onDone()}
  else{G.mist++;flash(m,'wrong');info();
    (G.round.conf||(G.round.conf={}))[label]=[...((G.round.conf||{})[label]||[]),nameM(m)];
    if(G.mist>=2)showAnswer(t,label);else fb('Try again.','bad')}
}
function showAnswer(t,label){
  clearTimer();G.phase='answer';record(label,false);hint(t);autoOct(t);
  fb('Play the green key.','bad');draw();info();
  setTimeout(()=>playFor(t,900),450);
  setNext(()=>{clearHints();if(G.mode==='scroll'){G.phase='done';scrollAdvance()}else if(L[G.lv].type==='mel'){G.phase='done';melStep()}else newQ()});
}
function giveUp(){
  if(G.mode==='scroll'){const c=SC.notes[SC.i];if(G.phase==='ask'&&c){G.mist=2;showAnswer(midiOf(c.real),c.label)}return}
  if(G.mode!=='level'||G.phase!=='ask')return;const d=L[G.lv];G.mist=2;
  if(['note','acc','key'].includes(d.type))showAnswer(G.q.m,G.q.label);
  else if(d.type==='mel'){const n=G.mel.notes[G.mel.i];showAnswer(midiOf(n),nameN(n))}
  else{const b=[...$('choices').children].find(x=>x.dataset.ok==='1');revealChoice(b)}
}
function melStep(){
  const M=G.mel;M.i++;G.mist=0;G.nextFn=null;stdActions();
  if(M.i>=M.notes.length){G.phase='done';draw();fb('Melody done! Listen.','ok');
    const ms=420;M.notes.forEach((n,i)=>setTimeout(()=>playFor(midiOf(n),ms-40),300+i*ms));
    setTimeout(()=>{if(G.mode==='level'&&L[G.lv].type==='mel')newQ()},300+M.notes.length*ms+500);return}
  G.phase='ask';clearHints();draw();info();autoOct(midiOf(M.notes[M.i]));startTimer();
  if(M.i>0)fb('Correct!','ok');
}
function makeMel(){
  const pool=nats(60,72);const len=4+Math.floor(Math.random()*5);let i=Math.floor(Math.random()*5);const notes=[];
  for(let k=0;k<len;k++){notes.push(pool[i]);let step=rand([-2,-1,-1,1,1,2]);if(i+step<0||i+step>=pool.length)step=-step;i+=step}
  G.mel={notes,i:0};G.q={label:'mel'};
}
function makeBar(){
  const top=rand([2,3,4]);const gap=rand([.5,1,1,2,3,4].filter(v=>v<top||(top===4&&v<4)).filter(v=>v<top));
  let rem=top-gap;const vals=[];
  while(rem>0){const v=rand([.5,1,1,2].filter(x=>x<=rem));if(v===.5&&rem>=1){vals.push(.5,.5);rem-=1}else{vals.push(v);rem-=v}}
  G.q={top,gap,vals,label:`${top}/4 bar`};
}
function choiceBtn(t,ok,onRight){
  const b=document.createElement('button');b.textContent=t;b.dataset.ok=ok?'1':'0';
  b.onclick=()=>{if(G.phase!=='ask')return;
    if(ok){b.classList.add('ok');G.phase='done';fb('Yes!','ok');record(G.q.label,G.mist===0);onRight();
      const wait=L[G.lv].type==='bar'?G.q.top*600+700:G.q.v.b*600+700;setNext(newQ);setTimeout(()=>{if(G.phase==='done'&&G.nextFn===newQ)newQ()},wait)}
    else{b.classList.add('bad');G.mist++;(G.round.conf||(G.round.conf={}))[G.q.label]=[...((G.round.conf||{})[G.q.label]||[]),t.split(' ·')[0]];info();if(G.mist>=2)revealChoice([...$('choices').children].find(x=>x.dataset.ok==='1'));else fb('Try again.','bad')}};
  $('choices').append(b);
}
function revealChoice(b){
  b.classList.add('ok');G.phase='done';record(G.q.label,false);
  const d=L[G.lv];
  if(d.type==='val'){fb(`It is a ${G.q.v.lab}: ${bstr(G.q.v.b)} beat${G.q.v.b===1?'':'s'}.`,'bad');playValue(G.q.v)}
  else{const o=BAROPT.find(x=>x.v===G.q.gap);G.q.ans=o;draw();fb(`The bar needs ${bstr(G.q.gap)} more beat${G.q.gap===1?'':'s'}: ${o.lab}.`,'bad');playBar()}
  setNext(newQ);
}
function playValue(v){const beat=600;
  for(let i=0;i<Math.ceil(v.b);i++)setTimeout(()=>click(i===0),i*beat);
  if(!v.rest)playFor(69,v.b*beat-60)}
function playBar(){const beat=600,q=G.q,all=[...q.vals,q.gap];
  for(let i=0;i<q.top;i++)setTimeout(()=>click(i===0),i*beat);
  let t=0;all.forEach(v=>{setTimeout(()=>playFor(69,v*beat-60),t*beat);t+=v})}

// ---------- timer ----------
function startTimer(){clearTimer();const d=L[G.lv];if(!S.timer||G.mode!=='level'||!['note','acc','key','mel'].includes(d.type))return;
  G.tLeft=S.timer;G.timer=setInterval(()=>{if(document.querySelector('.ov.show'))return;G.tLeft-=.25;info();if(G.tLeft<=0){clearTimer();if(G.phase==='ask'){G.mist=2;fb("Time's up.",'bad');giveUpTimer()}}},250)}
function giveUpTimer(){const d=L[G.lv];if(d.type==='mel'){const n=G.mel.notes[G.mel.i];showAnswer(midiOf(n),nameN(n))}else showAnswer(G.q.m,G.q.label)}
function clearTimer(){if(G.timer){clearInterval(G.timer);G.timer=null}}

// ---------- listen ----------
function listen(){
  const d=L[G.lv];let seq=[];
  if(G.mode==='free')return;
  if(d.type==='note')seq=[...new Set(d.pool().map(midiOf))].sort((a,b)=>a-b);
  else if(d.type==='acc')seq=Array.from({length:13},(_,i)=>60+i);
  else if(d.type==='key'){const k=G.q.ks;seq=nats(60,72).map(n=>{const sg=k.sig.find(x=>x[0]===n.L);return midiOf({...n,a:sg?sg[1]:0})});const r=seq[0]===60&&k.nm!=='G major'?seq:seq;seq=r}
  else if(d.type==='val'){playValue(G.q.v);return}
  else if(d.type==='bar'){playBar();return}
  else if(d.type==='mel')seq=G.mel.notes.map(midiOf);
  seq.forEach((m,i)=>setTimeout(()=>playFor(m,380),i*420));
}

// ---------- summary ----------
function summary(partial){partial=partial===true;
  playView(0);
  clearTimer();const r=G.round,pct=Math.round(100*r.good/Math.max(1,r.n));
  const isSong=G.mode==='scroll'&&SC.src==='song',inScroll=G.mode==='scroll',focus=!!G.focus&&!inScroll;let unl='';
  if(!isSong&&!focus&&!partial){P.best[G.lv]=Math.max(P.best[G.lv]||0,pct);
  if(pct>=80&&G.lv===P.unlocked&&G.lv<L.length-1){P.unlocked++;unl=`<p class="okline">✓ Level ${G.lv+1} is open.</p>`}}
  if(isSong&&APP.song&&!partial)P.songs[APP.song]=Math.max(P.songs[APP.song]||0,pct);
  saveP();renderLevels();
  const view=inScroll?SC.view:L[G.lv].view,conf=r.conf||{};
  const miss=Object.entries(r.miss).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const canNext=!partial&&!isSong&&!focus&&G.lv<L.length-1&&(S.all||G.lv+1<=P.unlocked);
  const canFocus=!inScroll&&['note','acc'].includes(L[G.lv].type)&&miss.length>0;
  const status=partial?'Stopped early':isSong?(pct>=80?'Song learnt ✓':'Play it again'):focus?'Missed-notes practice':pct>=80?'Level passed ✓':'Need 80% to pass';
  const mx=miss.length?miss.map(([k,v])=>{const c=conf[k]?[...new Set(conf[k])]:[];const ex=explain(k,view);
    return `<details class="mx"><summary><b>${k}</b> · missed ${v}×${c.length?` · you played ${c.slice(0,3).join(', ')}`:''}</summary>${ex||'<p class="small">No extra notes for this one.</p>'}</details>`}).join(''):'<p class="small">No mistakes this round.</p>';
  $('sumBox').innerHTML=`<h2>${partial?'Stopped early':isSong?'Song done':focus?'Practice done':'Round done'}</h2>
<div class="stats"><div><b>${r.good}/${r.n}</b><small>${SC.tempo&&inScroll?'clean notes':'right first try'}</small></div><div><b>${pct}%</b><small>score</small></div><div><b>${status}</b><small>${partial?'not counted as a full round':isSong||focus?'':'80% opens the next level'}</small></div></div>${unl}
${tempoSum()}<h3>What to work on</h3>${mx}${miss.length?'<p class="small">Tap a note to see why. Missed notes come back more often next time.</p>':''}
<div class="row"><button class="pri" id="sAgain">↺ Practise again</button>${canNext?'<button class="pri" id="sNext">Next level ▶</button>':''}${canFocus?'<button id="sFocus">🎯 Practise missed notes</button>':''}${isSong&&nextSong()?'<button id="sNextSong">Next song ▶</button>':''}<button id="sGuide">📖 Music guide</button><button id="sBack">${isSong?'◀ Songs':'◀ Levels'}</button></div>`;
  open('ovSum');hearBind($('sumBox'));
  $('sAgain').onclick=()=>{close('ovSum');restart()};
  if($('sNextSong'))$('sNextSong').onclick=()=>{close('ovSum');playSong(nextSong())};
  if($('sFocus'))$('sFocus').onclick=()=>{close('ovSum');practiseMissed(miss.map(x=>x[0]))};
  $('sGuide').onclick=()=>{close('ovSum');openRef(()=>open('ovSum'))};
  $('sBack').onclick=()=>go(isSong?'songs':APP.from);
  if(canNext)$('sNext').onclick=()=>{close('ovSum');if(inScroll){G.lv++;startScroll('level')}else setLevel(G.lv+1)};
  G.phase='done';G.nextFn=null;actions([]);
}

function yin(b,sr){
  const W=1024,tMin=Math.floor(sr/2100),tMax=Math.min(b.length-W-1,Math.floor(sr/60));const d=new Float32Array(tMax+1);
  for(let t=1;t<=tMax;t++){let x=0;for(let i=0;i<W;i++){const v=b[i]-b[i+t];x+=v*v}d[t]=x}
  let run=0;d[0]=1;for(let t=1;t<=tMax;t++){run+=d[t];d[t]=run?d[t]*t/run:1}
  let tau=-1;for(let t=tMin;t<=tMax;t++){if(d[t]<.15){while(t+1<=tMax&&d[t+1]<d[t])t++;tau=t;break}}
  if(tau<0){let best=tMin;for(let t=tMin;t<=tMax;t++)if(d[t]<d[best])best=t;if(d[best]<.3)tau=best;else return null}
  const a=d[tau-1]??d[tau],c=d[tau+1]??d[tau],den=a+c-2*d[tau];const sh=den?(a-c)/(2*den):0;

function octLow(b,f,sr){return (gz(b,f/2,sr)+gz(b,1.5*f,sr))/Math.max(gz(b,f,sr),1e-9)>.08}
function analyse(){
  if(!MIC.on)return;MIC.an.getFloatTimeDomainData(MIC.buf);
  let r=0;for(const v of MIC.buf)r+=v*v;r=Math.sqrt(r/MIC.buf.length);
  const mt=$('micMeter');if(mt)mt.style.width=Math.min(100,r*400)+'%';
  const gate=.003+(1-S.sens)*.03;
  // short window = sharp onset; a new key press shows as a jump above the recent low
  let rs=0;for(let i=MIC.buf.length-512;i<MIC.buf.length;i++)rs+=MIC.buf[i]*MIC.buf[i];rs=Math.sqrt(rs/512);
  const hist=MIC.hist||(MIC.hist=[]);const low=hist.length?Math.min(...hist):rs;hist.push(rs);if(hist.length>6)hist.shift();
  if(r<gate){if(++MIC.quiet>3){MIC.emitted=null;if(MIC.holding!=null){const h=MIC.holding;MIC.holding=null;if(SC.tempo)tempoRelease(h,'mic')}}MIC.cand=null;MIC.stable=0;return}
  MIC.quiet=0;
  if(rs>low*1.45&&rs-low>gate*.8&&Date.now()-(MIC.lastAt||0)>120&&Date.now()-(MIC.emitAt||0)>300){MIC.emitted=null;MIC.stable=0;MIC.lastAt=Date.now();hist.length=0;hist.push(rs)}   // same note pressed again
  const y=yin(MIC.buf,ctx.sampleRate);if(!y)return;
  let f=y.f,dn=false;if(f>235&&f<485&&octLow(MIC.buf,f,ctx.sampleRate)){f/=2;dn=true}   // B2–A#3: weak fundamental, YIN reads one octave up; checked at f/2 and 3f/2
  const mf=69+12*Math.log2(f/440),m=Math.round(mf);if(m<LOW||m>HIGH)return;
  if(MIC.emitted!=null&&Math.abs(m-MIC.emitted)===12)return;          // octave jump with no new key press = decay noise
  if(m===MIC.cand)MIC.stable++;else{MIC.cand=m;MIC.stable=1}
  if(MIC.stable>=(dn?3:2)&&m!==MIC.emitted&&Date.now()>MIC.lock){MIC.emitted=m;MIC.emitAt=Date.now();heard(m,Math.round((mf-m)*100))}
}

function parseSong(txt){
  const out={title:'',notes:[],bad:[],view:null};
  for(const line of txt.split(/\r?\n/)){
    const t=line.trim();if(!t||t.startsWith('```'))continue;
    if(/^#/.test(t)){if(!out.title)out.title=t.replace(/^#+\s*/,'');continue}
    const tm=t.match(/^tempo\s*:\s*(\d+)/i);if(tm){out.tempo=Math.min(200,Math.max(30,+tm[1]));continue}
    const cm=t.match(/^clef\s*:\s*(treble|bass|grand)/i);if(cm){out.view=cm[1].toLowerCase();continue}
    if(!/[A-Ga-g][#b♯♭]?[0-8]/.test(t))continue;
    for(const tok of t.split(/[\s,]+/)){
      if(!tok)continue;
      if(tok==='|'){if(out.notes.length)out.notes[out.notes.length-1].bar=1;continue}
      const r=tok.match(/^(?:R|-|rest)(?::?([whqe])(\.)?)?$/i);
      if(r){out.notes.push({rest:1,dur:(r[1]||'q').toLowerCase(),dot:!!r[2]});continue}
      const m=tok.match(/^([A-Ga-g])([#b♯♭]?)([0-8])(?::?([whqeWHQE])(\.)?)?$/);
      if(!m){out.bad.push(tok);continue}
      const n={L:m[1].toUpperCase(),o:+m[3],a:m[2]==='#'||m[2]==='♯'?1:m[2]?-1:0};
      if(midiOf(n)<LOW||midiOf(n)>HIGH){out.bad.push(tok);continue}
      out.notes.push({n,real:n,dur:(m[4]||'q').toLowerCase(),dot:!!m[5],label:nameN(n)});
    }
  }
  if(!out.view){const ms=out.notes.filter(x=>!x.rest).map(x=>midiOf(x.real));
    out.view=!ms.length||Math.min(...ms)>=55?'treble':Math.max(...ms)<=64?'bass':'grand'}
  return out;
}
function pickLevelItem(){
  const d=L[G.lv],last=SC.notes.length?SC.notes[SC.notes.length-1].label:null;let pool,n,real;
  if(d.type==='note')pool=d.pool();
  else if(d.type==='acc'){pool=[];for(let m=48;m<=72;m++){const w=nat(m);if(w)pool.push(w);else{pool.push({...nat(m-1),a:1});pool.push({...nat(m+1),a:-1})}}}
  else if(d.type==='key')pool=nats(60,76);
  else pool=nats(60,72);
  do{n=weighted(pool,x=>nameN(x))}while(pool.length>1&&nameN(n)===last);
  real=n;if(SC.ks){const sg=SC.ks.sig.find(x=>x[0]===n.L);real={...n,a:sg?sg[1]:0}}

}

// ---------- tempo mode: notes move with the beat ----------
if(S.scMode==null)S.scMode='wait';if(S.tPct==null)S.tPct=100;if(S.tCount==null)S.tCount=1;

const TP={PPB:90,LX:200};   // pixels per beat, x of the blue line
const beatLen=c=>DURV[c.dur]*(c.dot?1.5:1);
const nowBeat=(t=ctx.currentTime)=>(t-SC.t0)*SC.bpm/60;
const holdNeed=c=>Math.max(c.d*.6,c.d-.5);           // beats to hold: q .6 · h 1.5 · w 3.5 · e .3
const holdOn=c=>c.src==='mic'?S.tHoldMic:S.tHold;
function tempoStop(){if(!SC.tempo)return;SC.tempo=false;SC.paused=false;SC.run=(SC.run||0)+1;cancelAnimationFrame(SC.raf);tempoMetOff()}
function tempoMetOff(){if(SC.metOwn){SC.metOwn=false;if(MET.on)metStop()}if(SC.prevBpm){MET.bpm=SC.prevBpm;SC.prevBpm=0;renderMet()}}
function startTempo(){
  ac();clearHints();
  if(SC.src==='level'){SC.notes=[];for(let k=0;k<ROUND;k++){const c=pickLevelItem();SC.notes.push(c);if((k+1)%MET.beats===0)c.bar=1}}

// start or go on from beat fromB, with a count-in

  MET.on=true;MET.beat=((Math.round(fromB-cin)%MET.beats)+MET.beats)%MET.beats;MET.next=ctx.currentTime+.25;

function tempoPause(){

function tempoResume(){if(!SC.paused)return;tempoGo(SC.pauseB<SC.startB?SC.startB:Math.max(0,Math.floor(SC.pauseB)))}

function tempoLoop(run){

function judgeTempo(m){

  record(c.label,c.res==='ok');
  if(SC.notes.every(x=>x.rest||x.res)){SC.done=true;const run=SC.run;tempoMetOff();clearHints();stdActions();
    setTimeout(()=>{if(SC.run===run&&G.mode==='scroll'){drawTempo(nowBeat());summary()}},900)}
}
function drawTempo(b){
  const SW=1000,LX=TP.LX,PPB=TP.PPB,g=SC.view==='grand',gg=effV(SC.view)==='grand',T=tops(effV(SC.view)),notes=[],bars=[];
  let ext=`<rect x="${LX-18}" y="${gg?40:78}" width="36" height="${gg?206:90}" rx="8" fill="#1f6feb" opacity=".10"/>`+
    `<line x1="${LX}" x2="${LX}" y1="${gg?36:72}" y2="${gg?250:172}" stroke="#1f6feb" stroke-width="2" opacity=".55"/>`;
  const cur=SC.notes[SC.curIdx];
  for(const c of SC.notes){
    const x=LX+(c.t-b)*PPB,xe=x+c.d*PPB;if(x>SW-22)break;
    if(c.bar){const bx=xe-22;if(bx>104&&bx<SW-12)bars.push(bx)}
    if(x<104)continue;
    const col=c.res==='ok'?'#1f9d55':c.res==='miss'?'#d64545':c.res?'#d98b00':c===cur?'#1f6feb':c.hit?'#1f9d55':'#1d2430';
    if(c.rest){notes.push({x,rest:1,dur:c.dur,color:'#1d2430',clef:SC.view==='bass'?'bass':'treble'});continue}
    const nt={n:c.n,x,dur:c.dur,dot:c.dot,color:col};if(!g)nt.clef=SC.view;
    if(c.tag){nt.label=c.tag;nt.labCol=col}else if(S.staffNames&&!c.res){nt.label=c.label;nt.labCol='#6b7380'}
    notes.push(nt);
    const cl=g?(midiOf(c.n)>=60?'treble':'bass'):SC.view,y=yOf(stepOf(c.n),cl,T),w=xe-x-24;
    if(w>4){ext+=`<rect x="${x+12}" y="${y-2}" width="${w}" height="4" rx="2" fill="${col}" opacity=".22"/>`;
      if(c.hitB!=null){const e=Math.min(c.relB??b,c.t+c.d),hx0=Math.max(x+12,LX+(c.hitB-b)*PPB),hx1=Math.min(x+12+w,LX+(e-b)*PPB);
        if(hx1>hx0)ext+=`<rect x="${hx0}" y="${y-3}" width="${hx1-hx0}" height="6" rx="3" fill="${c.short?'#d98b00':'#1f9d55'}" opacity=".6"/>`}}
  }
  $('staff').innerHTML=svgStaff({view:SC.view,notes,sig:SC.sig,bars,extra:ext,W:SW});
}
function tempoSum(){
  if(!(G.mode==='scroll'&&SC.tempo))return '';const t=SC.st,ms=t.ms,avg=ms.length?Math.round(ms.reduce((a,b)=>a+b,0)/ms.length):0;
  const tip=Math.abs(avg)<40?'Your timing is centred. Good.':avg>0?`On average you play ${avg} ms late.`+(MIC.on?' If it feels on time, raise "Input delay" in Set up my piano → Advanced.':' Count the beat out loud.'):`On average you play ${-avg} ms early. Wait for the blue line.`;
  return `<h3>Timing · ${SC.bpm} bpm</h3><pre class="tip">On time  ${t.ok}
Early    ${t.early}
Late     ${t.late}
Missed   ${t.miss}${S.tHold||S.tHoldMic?`\nShort hold ${t.short}`:''}
Wrong key ${t.wrong}</pre><p class="small">${tip}${t.ok+t.early+t.late&&t.ok/(t.ok+t.early+t.late)>=.8&&S.tPct<100?' Try a faster speed next.':''}</p>`;
}

const WEB={on:/\.github\.io$/i.test(location.hostname),files:null,msg:'',busy:false};
async function webScan(){if(WEB.busy)return;WEB.busy=true;WEB.msg='';
  try{const owner=location.hostname.split('.')[0],repo=location.pathname.split('/').filter(Boolean)[0]||'';
    const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/songs`,{cache:'no-store'});
    if(r.status===404){WEB.files=[]}else{if(!r.ok)throw new Error('error '+r.status);
      WEB.files=(await r.json()).filter(f=>f.type==='file'&&/\.(md|txt)$/i.test(f.name)).map(f=>({name:f.name,url:f.download_url})).sort((a,b)=>a.name.localeCompare(b.name))}
  }catch(e){WEB.files=[];WEB.msg='Could not read the songs list ('+e.message+'). Check the internet, then press ↻.'}
  WEB.busy=false;if($('ovScroll').classList.contains('show'))openScroll();if(G.mode==='menu'&&APP.scr==='songs')render()}
async function webLoad(f){const txt=await (await fetch(f.url,{cache:'no-store'})).text();const song=parseSong(txt);
  if(!song.title)song.title=f.name.replace(/\.(md|txt)$/i,'');S.lastWeb=f.name;saveS();
  if(!song.notes.some(x=>!x.rest))return null;SC.song=song;store('song',{txt,name:f.name});return song}

// ---------- metronome ----------
const MET={on:false,bpm:S.bpm||80,beats:S.beats||4,next:0,beat:0,timer:0,shown:-1};
function tick(t,strong){if(S.mute)return;const c=ac(),len=Math.floor(c.sampleRate*.03),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);   // noise tick: no pitch, so the listen page ignores it
  const src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();src.buffer=buf;f.type='bandpass';f.frequency.value=strong?3200:1900;f.Q.value=.9;g.gain.value=strong?2:1.2;
  src.connect(f);f.connect(g);g.connect(master);src.start(t)}
function metSched(){while(MET.next<ctx.currentTime+.12){const b=MET.beat;tick(MET.next,b===0);setTimeout(()=>metShow(b),Math.max(0,(MET.next-ctx.currentTime)*1000));MET.next+=60/MET.bpm;MET.beat=(MET.beat+1)%MET.beats}}
function metStart(){ac();MET.on=true;MET.beat=0;MET.next=ctx.currentTime+.08;
  if(SC.tempo&&!SC.done){const spb=60/MET.bpm,k=Math.ceil((ctx.currentTime+.05-SC.t0)/spb);MET.next=SC.t0+k*spb;MET.beat=((k%MET.beats)+MET.beats)%MET.beats}clearInterval(MET.timer);MET.timer=setInterval(metSched,25);metSched();renderMet()}
function metStop(){MET.on=false;clearInterval(MET.timer);MET.shown=-1;metShow(-1);renderMet()}
function metToggle(){MET.on?metStop():metStart()}
function metShow(b){if(!MET.on&&b>=0)return;MET.shown=b;const bt=$('bMet');
  bt.classList.toggle('live',MET.on);bt.style.display=MET.on?'':'none';bt.textContent=MET.on?`⏱ ${MET.bpm} · ${'●'.repeat(b+1)}${'○'.repeat(MET.beats-b-1)}`:'⏱';
  document.querySelectorAll('#metDots span').forEach((e,i)=>e.classList.toggle('on',i===b))}
function metSet(bpm){MET.bpm=Math.min(200,Math.max(30,Math.round(bpm)));S.bpm=MET.bpm;saveS();renderMet()}
function renderMet(){
  if(!$('ovMet').classList.contains('show')){metShow(MET.shown);return}
  $('metBox').innerHTML=`<h2>⏱ Metronome</h2>
<div class="bpm">${MET.bpm} <span class="small">beats per minute</span></div>
<div class="dots" id="metDots">${Array.from({length:MET.beats},(_,i)=>`<span class="${i===0?'one':''}"></span>`).join('')}</div>
<div class="row" style="justify-content:center"><button id="mtM5">−5</button><button id="mtM1">−1</button>
<input type="range" id="mtBpm" min="30" max="200" value="${MET.bpm}" style="width:220px"><button id="mtP1">+1</button><button id="mtP5">+5</button></div>
<label class="set">Beats in a bar <select id="mtBeats">${[2,3,4,6].map(v=>`<option value="${v}" ${MET.beats==v?'selected':''}>${v}</option>`).join('')}</select></label>
<pre class="tip">Slow: 50–70 · Walking (Andante): 76–100 · Fast (Allegro): 120+
Beat 1 is the higher tick. Key M = start / stop.</pre>
<div class="row"><button class="pri" id="mtGo">${MET.on?'■ Stop':'▶ Start'}</button><button data-close="ovMet">Close</button></div>`;
  $('mtGo').onclick=metToggle;
  [['mtM5',-5],['mtM1',-1],['mtP1',1],['mtP5',5]].forEach(([id,d])=>$(id).onclick=()=>metSet(MET.bpm+d));
  $('mtBpm').oninput=e=>{MET.bpm=+e.target.value;S.bpm=MET.bpm;saveS();document.querySelector('.bpm').firstChild.textContent=MET.bpm+' '};
  $('mtBpm').onchange=()=>renderMet();
  $('mtBeats').onchange=e=>{MET.beats=+e.target.value;S.beats=MET.beats;saveS();MET.beat=0;renderMet()};
  metShow(MET.shown);
}

async function recTest(){if(APP.rec)return;if(!MIC.on)await micStart();if(!MIC.stream||!window.MediaRecorder){alert2('Recording is not supported in this browser.');return}
  const mr=new MediaRecorder(MIC.stream),ch=[];mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  mr.onstop=()=>{const t=mr.mimeType||'audio/webm',b=new Blob(ch,{type:t}),a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='piano-test-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+(t.includes('ogg')?'.ogg':t.includes('mp4')?'.m4a':'.webm');document.body.append(a);a.click();a.remove();APP.rec=0;if(APP.scr==='setup'&&G.mode==='menu')render()};
  mr.start();APP.rec=1;render();setTimeout(()=>{try{mr.stop()}catch(e){}},15000)}
function alert2(t){const e=$('suC4');if(e)e.textContent=t}
function setupHeard(m){const h=$('suHeard');if(h)h.textContent=nameFull(m);const lg=APP.log||(APP.log=[]);lg.push(nameM(m));if(lg.length>14)lg.shift();const le=$('suLog');if(le)le.textContent=lg.join('  ');if(m===60&&!APP.c4){APP.c4=1;S.c4=1;saveS();render()}}
function rLearn(){
  let h=scrTop('2 · Learn to read','Each level: Learn card → 20 questions → result. 80% right on the first try opens the next level.')+'<div class="list">';
  for(let i=1;i<L.length;i++){const o=lvOpen(i),b=P.best[i];
    h+=`<div class="lrow"><button class="item${b>=80?' done':''}" data-lv="${i}" ${o?'':'disabled'}><span class="num">${b>=80?'✓':o?i:'🔒'}</span><span class="tx"><b>L${i} · ${L[i].t}</b><small>${b!=null?'Best '+b+'%':o?'Not tried':'Opens at 80% in L'+(i-1)}</small></span><span class="go">›</span></button><button class="sc" data-sc="${i}" ${o?'':'disabled'} title="Notes move, play the blue note">▶ Play along</button></div>`}
  return h+'</div>';
}
function songSrc(){
  if(WEB.on){if(WEB.files===null){webScan();return '<p class="sub">Loading songs…</p>'}
    return `<div class="row"><span class="small">${WEB.msg||WEB.files.length+' songs. New song: upload a .md file to the songs folder on GitHub, wait a minute, press ↻.'}</span><button id="aScan">↻</button></div><p class="small" id="aMsg2"></p>`}
  if(LIB.unsupported)return '<p class="sub">The songs folder needs Chrome or Edge. Use "Load one file" below.</p>';
  if(!LIB.dir)return '<div class="row"><button class="pri" id="aPick">📁 Pick songs folder</button></div><p class="small">Pick once. The page remembers it.</p>';
  if(LIB.perm!=='granted')return `<div class="row"><button class="pri" id="aRe">📁 Open "${LIB.dir.name}" again</button><button id="aPick">Change folder</button></div><p class="small">The browser asks again each time it restarts.</p>`;
  return `<div class="row"><span class="small">Folder: ${LIB.dir.name} · ${songFiles().length} songs</span><button id="aScan">↻</button><button id="aPick">Change folder</button></div><p class="small" id="aMsg2"></p>`;
}
function rSongs(){
  const t=S.scMode==='tempo';
  let h=scrTop('3 · Play songs','Pick a song. "✓ ready" = you passed the reading level it needs. All songs stay open.')+
`<div class="opts"><span class="seg"><button data-m="wait" class="${t?'':'on'}">No rush</button><button data-m="tempo" class="${t?'on':''}">Play with the beat</button></span>
${t?`<label>Speed <select id="aPct">${[50,60,75,90,100].map(v=>`<option value="${v}" ${S.tPct==v?'selected':''}>${v}%</option>`).join('')}</select></label><label>Count-in <select id="aCin">${[1,2].map(v=>`<option value="${v}" ${S.tCount==v?'selected':''}>${v} bar${v>1?'s':''}</option>`).join('')}</select></label>`:''}
<label><input type="checkbox" id="aNames" ${S.staffNames?'checked':''}> Names on staff</label><label><input type="checkbox" id="aHint" ${S.keyHint?'checked':''}> Show next key</label></div>
${S.lastPlayed&&songFiles().includes(S.lastPlayed)?`<button class="pri cont" data-song="${S.lastPlayed}">▶ Play again: ${songName(S.lastPlayed)}</button>`:''}<p class="sub">${t?'Play with the beat: notes move with the beat. Play when a note reaches the blue line.':'No rush: each note waits for you.'}</p>`+songSrc();
  const f=songFiles();
  if(f.length){const by={};f.forEach(n=>{const k=songLv(n);(by[k]=by[k]||[]).push(n)});
    Object.keys(by).map(Number).sort((a,b)=>(a||99)-(b||99)).forEach(k=>{
      h+=`<div class="grp">${k?`S${k} · ${SONGTXT[k]||''}`+(SONGLV[k]?(ready(k)?' <span class="tag ok">✓ ready</span>':` <span class="tag">ready after L${SONGLV[k]}</span>`):''):'Other songs'}</div><div class="list">`+
      by[k].map(n=>{const b=P.songs[n];return `<button class="item${b>=80?' done':''}" data-song="${n}"><span class="num">${b>=80?'✓':'♪'}</span><span class="tx"><b>${songName(n)}</b><small>${b!=null?'Best '+b+'%':'Not played'}</small></span><span class="go">▶</span></button>`}).join('')+'</div>'})}
  return h+`<div class="grp">Or load one file</div><div class="panel"><input type="file" id="aFile" accept=".md,.txt"> <span class="small" id="aMsg"></span></div>`;
}
async function playSong(n){const m=$('aMsg2');S.lastPlayed=n;saveS();
  try{const sg=WEB.on?await webLoad(WEB.files.find(f=>f.name===n)):await libLoad(n);
    if(!sg){if(m)m.textContent='No notes found in '+n;else go('songs');return}
    APP.song=n;enter('songs');startScroll('song');if(sg.bad.length)fb('Skipped (not understood): '+sg.bad.slice(0,8).join(' '),'bad')}
  catch(e){if(m)m.textContent='Could not load '+n+'. Press ↻.';else go('songs')}}
function rProg(){
  let h=scrTop('My learning')+'<div class="grp">Reading levels</div><div class="list">';
  for(let i=1;i<L.length;i++){const b=P.best[i];h+=`<button class="item" data-plv="${i}" ${lvOpen(i)?'':'disabled'}><span class="num">${b>=80?'✓':lvOpen(i)?i:'🔒'}</span><span class="tx"><b>L${i} · ${L[i].t}</b></span><span class="r">${b!=null?b+'%':'—'} ›</span></button>`}
  h+='</div><div class="grp">Songs</div><div class="list">';
  const s=Object.entries(P.songs).sort((a,b)=>a[0].localeCompare(b[0]));
  h+=s.length?s.map(([n,b])=>`<button class="item" data-psong="${n}"><span class="num">${b>=80?'✓':'♪'}</span><span class="tx"><b>${(songLv(n)?'S'+songLv(n)+' · ':'')+songName(n)}</b></span><span class="r">${b}% ▶</span></button>`).join(''):'<p class="sub">No songs played yet.</p>';
  h+='</div>';
  const miss=Object.entries(P.miss).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(miss.length)h+=`<div class="grp">Notes you miss most</div><pre class="tip">${miss.map(([k,v])=>'L'+k.replace(':',' · ')+'  ×'+v).join('\n')}</pre>`;
  return h;
}
const BIND={
  prog(){document.querySelectorAll('[data-plv]').forEach(b=>b.onclick=()=>{enter('learn');setLevel(+b.dataset.plv)});
    document.querySelectorAll('[data-psong]').forEach(b=>b.onclick=()=>{if(WEB.on&&!WEB.files){go('songs');return}playSong(b.dataset.psong)})},
  home(){if($('hCont'))$('hCont').onclick=()=>{enter('learn');setLevel(nextLevel())};
    $('tMet').onclick=()=>{$('ovMet').classList.add('show');renderMet()};
    $('tRef').onclick=openRef;$('tSet').onclick=openSet;
    $('tDark').onclick=()=>{S.dark=!S.dark;saveS();darkIcon();render()}},
  setup(){$('suKeys').onclick=()=>{S.input='keys';S.setup=1;saveS();render()};
    $('suPiano').onclick=()=>{S.input='piano';saveS();render()};
    if(S.input==='piano'&&!APP.devs){APP.devs=1;fillDevices().then(()=>{if(G.mode==='menu'&&APP.scr==='setup')render()})}
    if($('suConMic'))$('suConMic').onclick=()=>{if(S.conn!=='mic'){APP.c4=false;S.c4=0}S.conn='mic';S.monitor=false;saveS();if(MIC.mon)MIC.mon.gain.value=0;render()};
    if($('suConCab'))$('suConCab').onclick=()=>{if(S.conn!=='cable'){APP.c4=false;S.c4=0}S.conn='cable';saveS();render()};
    if($('suDev'))$('suDev').onchange=async e=>{S.dev=e.target.value;APP.c4=false;S.c4=0;saveS();if(MIC.on){micStop();await micStart()}render()};
    if($('suMic'))$('suMic').onclick=async()=>{MIC.on?micStop():await micStart();render()};
    if($('suRec'))$('suRec').onclick=recTest;
    if($('suSens'))$('suSens').oninput=e=>{S.sens=+e.target.value;saveS()};
    if($('suLag'))$('suLag').oninput=e=>{S.micLag=+e.target.value;saveS();$('suLagV').textContent=S.micLag+' ms'};
    if($('suMon'))$('suMon').onchange=e=>{S.monitor=e.target.checked;saveS();if(MIC.mon)MIC.mon.gain.value=S.monitor?1:0};
    if($('suDone'))$('suDone').onclick=()=>{S.setup=1;saveS();go('learn')}},
  learn(){document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{enter('learn');setLevel(+b.dataset.lv)});
    document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{enter('learn');G.lv=+b.dataset.sc;startScroll('level')})},
  songs(){document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.scMode=b.dataset.m;saveS();render()});
    if($('aPct'))$('aPct').onchange=e=>{S.tPct=+e.target.value;saveS()};
    if($('aCin'))$('aCin').onchange=e=>{S.tCount=+e.target.value;saveS()};
    $('aNames').onchange=e=>{S.staffNames=e.target.checked;saveS()};
    $('aHint').onchange=e=>{S.keyHint=e.target.checked;saveS()};
    if($('aScan'))$('aScan').onclick=async()=>{if(WEB.on){WEB.files=null;render()}else{await libScan();render()}};
    if($('aPick'))$('aPick').onclick=async()=>{try{const h=await window.showDirectoryPicker({id:'songs',mode:'read'});LIB.dir=h;LIB.perm='granted';await IDB.set('songsDir',h);await libScan()}catch(e){}render()};
    if($('aRe'))$('aRe').onclick=async()=>{try{LIB.perm=await LIB.dir.requestPermission({mode:'read'})}catch(e){}if(LIB.perm==='granted')await libScan();render()};
    document.querySelectorAll('[data-song]').forEach(b=>b.onclick=()=>playSong(b.dataset.song));
    $('aFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
      rd.onload=()=>{const sg=parseSong(rd.result);if(!sg.notes.some(x=>!x.rest)){$('aMsg').textContent='No notes found in this file.';return}
        if(!sg.title)sg.title=f.name.replace(/\.(md|txt)$/i,'');SC.song=sg;store('song',{txt:rd.result,name:f.name});APP.song=null;enter('songs');startScroll('song')};
      rd.readAsText(f)}}
};
function openMenu(){const lv=G.mode==='level';
  const it=[['🎤',MIC.on?'Piano input (listening)':'Piano input',()=>$('bMic').click()],['⏱',MET.on?'Metronome (on)':'Metronome',()=>$('bMet').click()],['📖','Music guide',()=>openRef()],
    (lv||G.mode==='scroll')&&['↺','Restart',restart],(lv||G.mode==='scroll')&&G.round.n>0&&['■','Finish & review',finishEarly],lv&&['💡','Learn this level',()=>openLearn()],lv&&['📋','Change level',()=>{renderLevels();open('ovLv')}],
